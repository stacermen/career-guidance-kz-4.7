[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-guidance-backend"
version = "0.1.0"
description = "FastAPI backend for the Career Guidance KZ platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "anthropic>=0.39",
  "httpx>=0.27",
  "reportlab>=4.2",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B008: FastAPI uses `Depends()` / `Query()` etc. as default args by design.
# UP040: keep PEP-484 style for Pydantic v2 compatibility with TypeAlias.
ignore = ["E501", "B008", "UP040"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
